# Deploys firestore.rules to the real Firebase project whenever they change on main.
#
# It runs on the same push that makes Cloudflare build the app, so the new rules and the new
# app go live together. That matters for 016: the new rules refuse the old app's list saves,
# and the new app needs the new rules to save at all.
#
# Does nothing until it is set up, so it cannot put a red X on main before then. One-time
# setup, all in the browser:
#
#   1. Google Cloud console → IAM & Admin → Service Accounts (pick the Firebase project) →
#      Create service account, e.g. "github-rules-deploy". Grant it two roles:
#        - Firebase Rules Admin
#        - Service Usage Consumer
#   2. That service account → Keys → Add key → JSON. A file downloads.
#   3. GitHub repo → Settings → Secrets and variables → Actions:
#        - Secrets → New secret FIREBASE_SERVICE_ACCOUNT, paste the whole JSON file
#        - Variables → New variable FIREBASE_PROJECT_ID, the project id (the same value as
#          VITE_FIREBASE_PROJECT_ID). NOT demo-practice-vocabulary, which is the emulator's
#   4. Delete the downloaded JSON file from your computer.
#
# To deploy by hand without the command line: Actions → Deploy Firestore rules → Run workflow.
name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

# Two merges in quick succession must not deploy out of order.
concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The rules are the app's only server-side check. Never deploy a version whose tests
      # fail, even though CI already ran them on the branch.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - run: npx firebase deploy --only firestore:rules --project "$PROJECT" --non-interactive
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
