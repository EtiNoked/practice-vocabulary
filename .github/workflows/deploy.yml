# Only needed if you deploy to GitHub Pages instead of Cloudflare Pages.
#
# Deliberately manual-only (workflow_dispatch). Running on every push to main
# fails with "Ensure GitHub Pages has been enabled" until Pages is switched on,
# which puts a red X on every commit for a workflow most setups will never use.
#
# To use GitHub Pages:
#   1. Settings -> Pages -> Source: GitHub Actions
#   2. Set `base: '/practice-vocabulary/'` in vite.config.ts, or the deployed
#      page is blank with 404s on every asset
#   3. Run this workflow from the Actions tab, or restore the push trigger below
#
# See .claude/specs/001-vocab-trainer/deployment.md for the full walkthrough.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
