<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Strict by design: this app makes no network requests after load — no CDN,
      no fonts, no analytics. Nothing the user types ever leaves the device.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="description" content="Practise English and Dutch vocabulary by listening. Everything stays on your device." />
    <meta name="theme-color" content="#0f172a" />
    <title>Vocabulary Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
