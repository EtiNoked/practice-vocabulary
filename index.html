<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Still strict, but no longer airtight: v1 made no network requests at all,
      and accounts changed that. Every exception below is a NAMED Google origin
      required by Firebase Auth or Firestore — no wildcards like `https:`, no
      CDN, no fonts, no analytics. A signed-out user still triggers none of it.

        apis.google.com          the gapi loader behind signInWithPopup
        identitytoolkit / securetoken   the Auth REST endpoints
        firestore.googleapis.com the database, including its WebChannel listens
        *.firebaseapp.com        the authDomain helper iframe
        accounts.google.com      the Google account chooser
        *.googleusercontent.com  the signed-in user's profile photo

      If you add a Firebase product, its origin has to be added here too, or it
      fails with an opaque CSP error rather than a useful one.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; frame-src https://*.firebaseapp.com https://accounts.google.com; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="description" content="Practise English and Dutch vocabulary by listening. Works with no account; sign in to sync across devices." />
    <!-- Both match --color-ground, one per theme. This paints Android's address
         bar and an installed PWA's status bar, so a single stale value here opens
         the app with a band of the wrong colour above the page — mint over black
         now, which is the mirror of the black-over-mint defect 005 fixed.

         Media-scoped, so the OS preference is honoured with no JavaScript, the
         same way the palette itself is. An explicit override is a third case the
         browser cannot know about: theme.ts inserts a media-less tag first, and
         the browser takes the first theme-color whose media matches. -->
    <meta name="theme-color" content="#f6fbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1a1d" media="(prefers-color-scheme: dark)" />
    <title>Vocabulary Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
